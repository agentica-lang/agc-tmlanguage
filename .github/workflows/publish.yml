name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [both, marketplace, open-vsx]
        default: both

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MARKETPLACE: ${{ inputs.target != 'open-vsx' }}
      OPEN_VSX: ${{ inputs.target != 'marketplace' }}
    steps:
      - name: Check Open VSX token
        if: env.OPEN_VSX == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::Missing repository secret: OVSX_PAT"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: agentica-lang/agentica
          ref: 7e6f43647cd54f1b6a6163c99a6af6acad006325 # 0.38.0
          path: agentica
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:repo -- agentica
      - run: npm run package -- --out agentica.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: agentica-vsix
          path: agentica.vsix
      - name: Publish to the VS Code Marketplace
        if: env.MARKETPLACE == 'true'
        run: npx vsce publish --oidc --packagePath agentica.vsix --skip-duplicate
      - name: Publish to Open VSX
        if: env.OPEN_VSX == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --packagePath agentica.vsix --skip-duplicate
