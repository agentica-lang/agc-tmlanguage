name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [both, marketplace, open-vsx]
        default: both

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      MARKETPLACE: ${{ inputs.target != 'open-vsx' }}
      OPEN_VSX: ${{ inputs.target != 'marketplace' }}
    steps:
      - name: Check secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          missing=
          if [ "$MARKETPLACE" = true ] && [ -z "$VSCE_PAT" ]; then missing="$missing VSCE_PAT"; fi
          if [ "$OPEN_VSX" = true ] && [ -z "$OVSX_PAT" ]; then missing="$missing OVSX_PAT"; fi
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: sonic182/agentica
          ref: 3a20011922fde486662269bd6341800897485cb9
          path: agentica
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:repo -- agentica
      - run: npm run package -- --out agentica.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: agentica-vsix
          path: agentica.vsix
      - name: Publish to the VS Code Marketplace
        if: env.MARKETPLACE == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath agentica.vsix --skip-duplicate
      - name: Publish to Open VSX
        if: env.OPEN_VSX == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --packagePath agentica.vsix --skip-duplicate
