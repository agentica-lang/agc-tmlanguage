name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: agentica-lang/agentica
          ref: e90cf1207f8424745f7f67d28f6b67459d3b5bf3
          path: agentica
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:repo -- agentica
      - run: npm run package -- --out agentica.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: agentica-vsix
          path: agentica.vsix
          retention-days: 14
